[tox]
minversion = 1.6
envlist = sanity
skipsdist = True

[testenv:sanity]
# used just for validating the structure of the test case files themselves
deps = jsonschema==4.19.0
commands =
    {envpython} validation/check_validation_suite.py
    {envpython} output-tests/check_output_suite.py
    {envpython} output-tests/test_check_output_suite.py
